{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="{% static 'dashboard/styles.css' %}">
</head>
<body>
    <div class="auth-page">
        <div class="auth-shell">
            <div class="auth-visual">
                <div class="brand">
                    <div class="brand-mark">+</div>
                    <h2>CareSync</h2>
                </div>
                <div>
                    <p class="section-kicker" style="color:#dfeeff;">New account</p>
                    <h1>Create your care team access profile.</h1>
                </div>
                <div class="auth-feature-list">
                    <div class="auth-feature-item"><i class="fa-solid fa-user-shield"></i> Fast onboarding</div>
                    <div class="auth-feature-item"><i class="fa-solid fa-stethoscope"></i> Role-based access</div>
                    <div class="auth-feature-item"><i class="fa-solid fa-notes-medical"></i> Patient visibility</div>
                </div>
            </div>

            <div class="auth-card">
                <h2>Create account</h2>
                <p class="subtitle">Set up your secure hospital portal access.</p>

                <form method="post" class="auth-form">
                    {% csrf_token %}
                    {{ form.as_p }}
                    <button type="submit" class="auth-button">Register</button>
                </form>

                <p class="auth-footer">Already have an account? <a href="{% url 'login' %}">Login here</a></p>
            </div>
        </div>
    </div>
</body>
</html>
